[pytest]
testpaths = backend/tests
addopts = -ra -m "not llm"
markers =
    llm: calls the real Groq API and costs a little quota (run with: pytest -m llm)
    real_voices: uses the genuine Piper models in voices/ instead of the suite's stand-in folder (skipped where they aren't installed)
filterwarnings =
    ignore::DeprecationWarning
