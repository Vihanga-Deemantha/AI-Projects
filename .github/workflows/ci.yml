name: CI

# Runs on every push and pull request that touches Aurora/.
#   backend  — the pytest suite on a real Postgres. It needs no secrets, no network and no model
#              files: the AI and email services are faked and the voices are a stand-in folder
#              (backend/tests/conftest.py). The few tests of the genuine Piper models skip here.
#   frontend — lint + a production build
# The Playwright smoke test (frontend/e2e) is intentionally NOT run here: it needs the
# whole stack, real model files and a Groq key. Run it locally with `npm run e2e`.

on:
  push:
    paths: ["Aurora/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["Aurora/**", ".github/workflows/ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aurora
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura_dev_pass
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        # -d postgres: without it pg_isready probes a database named after the user ("aura"), which
        # doesn't exist, so the server logs `FATAL: database "aura" does not exist` on every check.
        options: >-
          --health-cmd "pg_isready -U aura -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create this database themselves; it must end in _test.
      TEST_DATABASE_URL: postgresql://aura:aura_dev_pass@localhost:5432/aura_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Aurora/backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aurora/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Aurora/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
